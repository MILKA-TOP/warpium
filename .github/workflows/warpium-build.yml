# Fork-only build pipeline for Warpium (the `oss` channel of this Warp fork).
#
# Builds an ad-hoc-signed, non-notarized Apple-silicon .dmg on GitHub-hosted
# runners, uploads it as a workflow artifact and, for `v*` tags, attaches it to
# a GitHub Release. It needs no secrets and no private Warp repositories.
name: Warpium Build

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'specs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'specs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warpium-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line-tables debuginfo is only useful for Sentry symbolication, which this
  # fork doesn't ship. Dropping it lowers peak rustc memory during ThinLTO on
  # the 7 GB standard runner and keeps the Rust cache well under 10 GB.
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  # Cheap canary: if hosted runners can't be acquired at all, fail here instead
  # of after a long macOS queue.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report runner
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH ($RUNNER_NAME)"
          df -h

  macos-arm64:
    name: Build macOS (arm64)
    needs: preflight
    # macos-15 (arm64) rather than macos-26: hosted macos-26 arm64 capacity
    # was unavailable for this repository and jobs were never acquired.
    runs-on: macos-15
    timeout-minutes: 330
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # The NLD classifier models are stored in Git LFS and embedded into
          # the binary; without them the app would embed LFS pointer files.
          lfs: true

      # macos-15 defaults to Xcode 16.4 but also ships Xcode 26.x; select the
      # newest 26.x to match upstream CI. script/macos/install_build_deps runs
      # `xcodebuild -downloadComponent MetalToolchain` (an Xcode 26 option, as
      # Xcode 26 no longer bundles the Metal compiler that warpui's build.rs uses).
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26'

      - name: Install Rust toolchain from rust-toolchain.toml
        # With no arguments, rustup (>= 1.28) installs the toolchain pinned in
        # rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: warpium-oss-macos-arm64
          # Feature branches can restore master's cache but don't save their
          # own, so the repository holds a single build cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install build dependencies
        run: |
          brew install protobuf create-dmg
          ./script/install_cargo_bundle
          # cargo-about generates THIRD_PARTY_LICENSES.txt for the bundle.
          ./script/install_cargo_release_deps --no-build-deps
          ./script/macos/install_build_deps

      - name: Compute build metadata
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="$REF_NAME"
            echo "release_tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            version="${SHA::8}"
          fi
          echo "artifact_name=Warpium-$version-macos-arm64" >> "$GITHUB_OUTPUT"
          df -h "$GITHUB_WORKSPACE"

      - name: Bundle Warpium.app and .dmg
        id: bundle
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          args=(--channel oss --arch aarch64 --selfsign --dmg-name-suffix arm64)
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          ./script/bundle "${args[@]}"

      - name: Report disk usage
        if: always()
        run: df -h "$GITHUB_WORKSPACE"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 30
          # The .dmg is already compressed (UDZO).
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: macos-arm64
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.macos-arm64.outputs.artifact_name }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.dmg \
            --verify-tag \
            --title "Warpium $TAG" \
            --generate-notes
