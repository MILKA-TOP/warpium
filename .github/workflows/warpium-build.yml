# Fork-only build pipeline for Warpium (the `oss` channel of this Warp fork).
#
# Builds an ad-hoc-signed, non-notarized Apple-silicon .dmg on GitHub-hosted
# runners, uploads it as a workflow artifact and, for Warpium release tags, attaches
# it to a GitHub Release. It needs no secrets and no private Warp repositories.
#
# Releases are normally cut with the "Warpium Release" workflow (warpium-release.yml),
# which pushes the tag and calls this workflow with `release_tag`; a tag pushed by
# hand still triggers the same release path.
#
# Every build is stamped with the version from WARPIUM_VERSION (see
# script/warpium/version), e.g. v0.2026.06.03.09.49.stable_00.1.
name: Warpium Build

on:
  push:
    branches: [master]
    # Only Warpium tags (an upstream release tag plus a `.N` fork counter, i.e. one more
    # dot than upstream's vN.YYYY.MM.DD.HH.MM.channel_NN), so mirrored upstream tags
    # never trigger a release.
    tags: ['v*.*.*.*.*.*.*_*.*']
    paths-ignore:
      - '**/*.md'
      - 'specs/**'
      - 'tools/**'
  pull_request:
    # `claude/**` lets PRs stacked on an unmerged fork branch build too.
    branches: [master, 'claude/**']
    paths-ignore:
      - '**/*.md'
      - 'specs/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      profile:
        description: Cargo profile (debug builds in a fraction of the time; release is what ships)
        type: choice
        options: [release, debug]
        default: release
  # Called by warpium-release.yml. Tags pushed with GITHUB_TOKEN don't trigger other
  # workflows, so the release workflow runs this build itself.
  workflow_call:
    inputs:
      release_tag:
        description: Warpium release tag to build and publish (must match WARPIUM_VERSION at that tag)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # A release_tag call shares the group of a pushed tag, so two builds of one release queue.
  group: warpium-build-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  # Only cancel superseded PR runs; master runs must finish to save the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line-tables debuginfo is only useful for Sentry symbolication, which this
  # fork doesn't ship. Dropping it lowers peak rustc memory during ThinLTO on
  # standard hosted runners and keeps the Rust cache well under 10 GB.
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  # Cheap canary: if hosted runners can't be acquired at all, or the version is
  # inconsistent, fail here instead of after a long macOS queue.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      plist_version: ${{ steps.version.outputs.plist_version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      # The tag to publish a release for; empty for branch and PR builds.
      release_tag: ${{ steps.version.outputs.release_tag }}
      # The upstream Warp commit the build is based on; empty if it couldn't be determined.
      upstream_base: ${{ steps.upstream_base.outputs.upstream_base }}
      # JSON list of Cargo profiles to build: `debug` for pull requests (fast to build,
      # enough for functional checks in the test VM), `release` (ThinLTO) for tags and
      # releases, both for master pushes (the debug build there keeps the debug cache
      # that pull requests restore warm).
      profiles: ${{ steps.version.outputs.profiles }}
    steps:
      - name: Report runner
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH ($RUNNER_NAME)"
          df -h

      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ inputs.release_tag || '' }}
          sparse-checkout: |
            WARPIUM_VERSION
            script/warpium
          sparse-checkout-cone-mode: false

      - name: Compute Warpium version
        id: version
        env:
          REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
          REF_NAME: ${{ inputs.release_tag || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROFILE: ${{ inputs.profile || '' }}
        run: |
          version="$(script/warpium/version --tag)"
          plist_version="$(script/warpium/version --plist)"
          if [[ "$EVENT_NAME" == "pull_request" || "$DISPATCH_PROFILE" == "debug" ]]; then
            profiles='["debug"]'
          elif [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "branch" && "$REF_NAME" == "master" ]]; then
            profiles='["release","debug"]'
          else
            profiles='["release"]'
          fi
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != "$version" ]]; then
              echo "::error::Tag $REF_NAME does not match WARPIUM_VERSION ($version). Bump WARPIUM_VERSION before tagging."
              exit 1
            fi
            artifact_name="Warpium-$version-macos-arm64"
            release_tag="$version"
          else
            artifact_name="Warpium-$version-${SHA::8}-macos-arm64"
            release_tag=""
          fi
          if [[ -n "$release_tag" && "$profiles" != '["release"]' ]]; then
            echo "::error::Releases must be built with the release profile only."
            exit 1
          fi
          {
            echo "version=$version"
            echo "plist_version=$plist_version"
            echo "artifact_name=$artifact_name"
            echo "release_tag=$release_tag"
            echo "profiles=$profiles"
          } >> "$GITHUB_OUTPUT"
          echo "Warpium $version (CFBundleShortVersionString $plist_version), profiles $profiles, artifact $artifact_name (debug builds add -debug)" >> "$GITHUB_STEP_SUMMARY"

      # Embedded as WARPIUM_UPSTREAM_BASE so the app can notify when upstream Warp has commits
      # this build lacks. A failed lookup only turns that notification off.
      - name: Compute upstream Warp base commit
        id: upstream_base
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A PR builds its merge ref, which the API can't look up, so take the newer of the bases
          # of the PR head and of the target branch: the merge contains both.
          SHA: ${{ github.event.pull_request.head.sha || '' }}
          TARGET_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          sha="${SHA:-$(git rev-parse HEAD)}"
          if base="$(script/warpium/upstream_base --sha "$sha")"; then
            if [[ -n "$TARGET_SHA" ]] && target_base="$(script/warpium/upstream_base --sha "$TARGET_SHA")" &&
              [[ "$target_base" != "$base" ]]; then
              # Both bases are on upstream master, so one contains the other.
              status="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/warpdotdev/warp/compare/$base...$target_base?per_page=1&page=2" |
                jq -r '.status')" || status=""
              if [[ "$status" == "ahead" ]]; then
                base="$target_base"
              fi
            fi
            echo "Upstream Warp base: $base" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not determine the upstream Warp base of $sha; the upstream update notification is off in this build."
            base=""
          fi
          echo "upstream_base=$base" >> "$GITHUB_OUTPUT"

  macos-arm64:
    name: Build macOS (arm64, ${{ matrix.profile }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.preflight.outputs.profiles) }}
    env:
      ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}${{ matrix.profile == 'debug' && '-debug' || '' }}
    # Hosted macOS arm64 runners (macos-26, macos-15) were never acquired for
    # this repository while ubuntu runners were, so cross-compile the arm64
    # app on an Intel runner instead.
    runs-on: macos-15-intel
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ inputs.release_tag || '' }}
          # The NLD classifier models are stored in Git LFS and embedded into
          # the binary; without them the app would embed LFS pointer files.
          lfs: true

      # macos-15-intel defaults to Xcode 16.4 but also ships Xcode 26.x; select the
      # newest 26.x to match upstream CI. script/macos/install_build_deps runs
      # `xcodebuild -downloadComponent MetalToolchain` (an Xcode 26 option, as
      # Xcode 26 no longer bundles the Metal compiler that warpui's build.rs uses).
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26'

      - name: Install Rust toolchain from rust-toolchain.toml
        # With no arguments, rustup (>= 1.28) installs the toolchain pinned in
        # rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # One cache per profile: debug and release artifacts share nothing.
          key: warpium-oss-macos-arm64-${{ matrix.profile }}
          # Feature branches restore master's caches but don't save their own
          # (a PR-scoped cache is invisible to other PRs); master saves both.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install build dependencies
        run: |
          brew install protobuf create-dmg
          ./script/install_cargo_bundle
          # cargo-about generates THIRD_PARTY_LICENSES.txt for the bundle.
          ./script/install_cargo_release_deps --no-build-deps
          ./script/macos/install_build_deps

      - name: Bundle Warpium.app and .dmg
        id: bundle
        env:
          # Baked into the app for the About page (ChannelState::display_version) and
          # converted to CFBundleShortVersionString/CFBundleVersion by script/update_plist.
          # Deliberately not GIT_RELEASE_TAG, which would make the app behave like an
          # official Warp release (remote-server version handshake, changelogs, updates).
          WARPIUM_VERSION_TAG: ${{ needs.preflight.outputs.version }}
          # Baked into the app for the upstream Warp update notification (app/src/warpium).
          WARPIUM_UPSTREAM_BASE: ${{ needs.preflight.outputs.upstream_base }}
          # The Intel host can't run the arm64 binary to dump the settings
          # schema, so the bundle ships without settings_schema.json.
          SKIP_SETTINGS_SCHEMA: '1'
          PROFILE: ${{ matrix.profile }}
          # Debug builds: no debuginfo at all (smaller objects, faster links, a smaller
          # cache). Panics still print symbolized backtraces from the symbol table.
          CARGO_PROFILE_DEV_DEBUG: '0'
        # warp_control_cli enables Warp's local-control API and bundles the
        # `warpctrl-oss` wrapper, so test harnesses can drive the app without focus
        # or synthetic input. The control server binds no port or socket and
        # publishes no discovery record until the user enables local control in
        # Settings > Scripting (LocalControlMode defaults to Disabled on oss); the
        # Scripting page, install-warpctrl commands and bundled warpctrl agent skill
        # are visible regardless.
        run: |
          df -h "$GITHUB_WORKSPACE"
          profile_flag=()
          if [[ "$PROFILE" == "debug" ]]; then
            profile_flag=(--debug)
          fi
          ./script/bundle --channel oss --arch aarch64 --selfsign "${profile_flag[@]}" \
            --features warp_control_cli \
            --dmg-name-suffix "$WARPIUM_VERSION_TAG-arm64"

      - name: Verify bundle version, icon and warpctrl
        env:
          DMG_PATH: ${{ steps.bundle.outputs.dmg_path }}
          EXPECTED_PLIST_VERSION: ${{ needs.preflight.outputs.plist_version }}
          WARPCTRL_COMMAND_NAME: ${{ steps.bundle.outputs.warpctrl_command_name }}
        run: |
          APP_PATH="$(dirname "$DMG_PATH")/Warpium.app"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          echo "CFBundleShortVersionString: $actual"
          if [[ "$actual" != "$EXPECTED_PLIST_VERSION" ]]; then
            echo "::error::Expected CFBundleShortVersionString $EXPECTED_PLIST_VERSION, got $actual"
            exit 1
          fi
          icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP_PATH/Contents/Info.plist")"
          icon_path="$APP_PATH/Contents/Resources/${icon%.icns}.icns"
          echo "CFBundleIconFile: $icon"
          find "$APP_PATH/Contents/Resources" -maxdepth 1 \( -name '*.icns' -o -name Assets.car \) -print
          if [[ ! -f "$icon_path" ]]; then
            echo "::error::App icon $icon_path is missing"
            exit 1
          fi
          # Check the wrapper inside the shipped .dmg, not just the staging copy.
          if [[ -z "$WARPCTRL_COMMAND_NAME" ]]; then
            echo "::error::script/bundle did not report a warpctrl wrapper; was warp_control_cli enabled?"
            exit 1
          fi
          mount_dir="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$DMG_PATH" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null || true' EXIT
          warpctrl_path="$mount_dir/Warpium.app/Contents/Resources/bin/$WARPCTRL_COMMAND_NAME"
          if [[ ! -x "$warpctrl_path" ]]; then
            echo "::error::warpctrl wrapper $WARPCTRL_COMMAND_NAME is missing from the .dmg"
            exit 1
          fi
          echo "warpctrl wrapper in .dmg: Warpium.app/Contents/Resources/bin/$WARPCTRL_COMMAND_NAME"

      - name: Report disk usage
        if: always()
        run: df -h "$GITHUB_WORKSPACE"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.bundle.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 30
          # The .dmg is already compressed (UDZO).
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [preflight, macos-arm64]
    if: needs.preflight.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # release_notes.sh lists the merged PRs.
      pull-requests: read
    steps:
      # Only for script/warpium/release_notes.sh; the notes query GitHub, not local history.
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          sparse-checkout: script/warpium
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: dist

      - name: Checksum and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          dmg="Warpium-$TAG-arm64.dmg"
          if [[ ! -f "dist/$dmg" ]]; then
            echo "::error::dist/$dmg is missing from the build artifact"
            ls -l dist
            exit 1
          fi
          # `shasum -a 256 -c` format, so users can verify the download next to the .dmg.
          (cd dist && sha256sum "$dmg" > "$dmg.sha256")
          script/warpium/release_notes.sh --tag "$TAG" --dmg "dist/$dmg" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          dmg="dist/Warpium-$TAG-arm64.dmg"
          # Only the highest version becomes Latest, so re-publishing an older release
          # doesn't move releases/latest (linked from the README) back to it.
          highest="$({
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' |
              grep -E '^v[0-9]+\.[0-9]{4}(\.[0-9]{2}){4}\.[a-z]+_[0-9]{2}\.[1-9][0-9]*$' || true
            echo "$TAG"
          } | sort -V | tail -n 1)"
          latest="$([[ "$highest" == "$TAG" ]] && echo true || echo false)"
          echo "Mark as latest: $latest (highest Warpium release: $highest)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run for an existing release: refresh the assets and the notes.
            gh release upload "$TAG" "$dmg" "$dmg.sha256" --clobber
            gh release edit "$TAG" --title "Warpium $TAG" --notes-file release-notes.md \
              --draft=false --prerelease=false --latest="$latest"
          else
            gh release create "$TAG" "$dmg" "$dmg.sha256" \
              --verify-tag \
              --title "Warpium $TAG" \
              --notes-file release-notes.md \
              --latest="$latest"
          fi
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
