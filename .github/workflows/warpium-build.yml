# Fork-only build pipeline for Warpium (the `oss` channel of this Warp fork).
#
# Builds an ad-hoc-signed, non-notarized Apple-silicon .dmg on GitHub-hosted
# runners, uploads it as a workflow artifact and, for Warpium release tags, attaches
# it to a GitHub Release. It needs no secrets and no private Warp repositories.
#
# Every build is stamped with the version from WARPIUM_VERSION (see
# script/warpium/version), e.g. v0.2026.06.03.09.49.stable_00.1.
name: Warpium Build

on:
  push:
    branches: [master]
    # Only Warpium tags (an upstream release tag plus a `.N` fork counter, i.e. one more
    # dot than upstream's vN.YYYY.MM.DD.HH.MM.channel_NN), so mirrored upstream tags
    # never trigger a release.
    tags: ['v*.*.*.*.*.*.*_*.*']
    paths-ignore:
      - '**/*.md'
      - 'specs/**'
  pull_request:
    # `claude/**` lets PRs stacked on an unmerged fork branch build too.
    branches: [master, 'claude/**']
    paths-ignore:
      - '**/*.md'
      - 'specs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warpium-build-${{ github.ref }}
  # Only cancel superseded PR runs; master runs must finish to save the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line-tables debuginfo is only useful for Sentry symbolication, which this
  # fork doesn't ship. Dropping it lowers peak rustc memory during ThinLTO on
  # standard hosted runners and keeps the Rust cache well under 10 GB.
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  # Cheap canary: if hosted runners can't be acquired at all, or the version is
  # inconsistent, fail here instead of after a long macOS queue.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      plist_version: ${{ steps.version.outputs.plist_version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    steps:
      - name: Report runner
        run: |
          echo "Runner: $RUNNER_OS $RUNNER_ARCH ($RUNNER_NAME)"
          df -h

      - uses: actions/checkout@v6.0.3
        with:
          sparse-checkout: |
            WARPIUM_VERSION
            script/warpium
          sparse-checkout-cone-mode: false

      - name: Compute Warpium version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="$(script/warpium/version --tag)"
          plist_version="$(script/warpium/version --plist)"
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != "$version" ]]; then
              echo "::error::Tag $REF_NAME does not match WARPIUM_VERSION ($version). Bump WARPIUM_VERSION before tagging."
              exit 1
            fi
            artifact_name="Warpium-$version-macos-arm64"
          else
            artifact_name="Warpium-$version-${SHA::8}-macos-arm64"
          fi
          {
            echo "version=$version"
            echo "plist_version=$plist_version"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"
          echo "Warpium $version (CFBundleShortVersionString $plist_version), artifact $artifact_name" >> "$GITHUB_STEP_SUMMARY"

  macos-arm64:
    name: Build macOS (arm64)
    needs: preflight
    # Hosted macOS arm64 runners (macos-26, macos-15) were never acquired for
    # this repository while ubuntu runners were, so cross-compile the arm64
    # app on an Intel runner instead.
    runs-on: macos-15-intel
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # The NLD classifier models are stored in Git LFS and embedded into
          # the binary; without them the app would embed LFS pointer files.
          lfs: true

      # macos-15-intel defaults to Xcode 16.4 but also ships Xcode 26.x; select the
      # newest 26.x to match upstream CI. script/macos/install_build_deps runs
      # `xcodebuild -downloadComponent MetalToolchain` (an Xcode 26 option, as
      # Xcode 26 no longer bundles the Metal compiler that warpui's build.rs uses).
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26'

      - name: Install Rust toolchain from rust-toolchain.toml
        # With no arguments, rustup (>= 1.28) installs the toolchain pinned in
        # rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: warpium-oss-macos-arm64
          # Feature branches can restore master's cache but don't save their
          # own, so the repository holds a single build cache.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install build dependencies
        run: |
          brew install protobuf create-dmg
          ./script/install_cargo_bundle
          # cargo-about generates THIRD_PARTY_LICENSES.txt for the bundle.
          ./script/install_cargo_release_deps --no-build-deps
          ./script/macos/install_build_deps

      - name: Bundle Warpium.app and .dmg
        id: bundle
        env:
          # Baked into the app for the About page (ChannelState::display_version) and
          # converted to CFBundleShortVersionString/CFBundleVersion by script/update_plist.
          # Deliberately not GIT_RELEASE_TAG, which would make the app behave like an
          # official Warp release (remote-server version handshake, changelogs, updates).
          WARPIUM_VERSION_TAG: ${{ needs.preflight.outputs.version }}
          # The Intel host can't run the arm64 binary to dump the settings
          # schema, so the bundle ships without settings_schema.json.
          SKIP_SETTINGS_SCHEMA: '1'
        # warp_control_cli enables Warp's local-control API and bundles the
        # `warpctrl-oss` wrapper, so test harnesses can drive the app without focus
        # or synthetic input. The control server binds no port or socket and
        # publishes no discovery record until the user enables local control in
        # Settings > Scripting (LocalControlMode defaults to Disabled on oss); the
        # Scripting page, install-warpctrl commands and bundled warpctrl agent skill
        # are visible regardless.
        run: |
          df -h "$GITHUB_WORKSPACE"
          ./script/bundle --channel oss --arch aarch64 --selfsign \
            --features warp_control_cli \
            --dmg-name-suffix "$WARPIUM_VERSION_TAG-arm64"

      - name: Verify bundle version, icon and warpctrl
        env:
          DMG_PATH: ${{ steps.bundle.outputs.dmg_path }}
          EXPECTED_PLIST_VERSION: ${{ needs.preflight.outputs.plist_version }}
          WARPCTRL_COMMAND_NAME: ${{ steps.bundle.outputs.warpctrl_command_name }}
        run: |
          APP_PATH="$(dirname "$DMG_PATH")/Warpium.app"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          echo "CFBundleShortVersionString: $actual"
          if [[ "$actual" != "$EXPECTED_PLIST_VERSION" ]]; then
            echo "::error::Expected CFBundleShortVersionString $EXPECTED_PLIST_VERSION, got $actual"
            exit 1
          fi
          icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP_PATH/Contents/Info.plist")"
          icon_path="$APP_PATH/Contents/Resources/${icon%.icns}.icns"
          echo "CFBundleIconFile: $icon"
          find "$APP_PATH/Contents/Resources" -maxdepth 1 \( -name '*.icns' -o -name Assets.car \) -print
          if [[ ! -f "$icon_path" ]]; then
            echo "::error::App icon $icon_path is missing"
            exit 1
          fi
          # Check the wrapper inside the shipped .dmg, not just the staging copy.
          if [[ -z "$WARPCTRL_COMMAND_NAME" ]]; then
            echo "::error::script/bundle did not report a warpctrl wrapper; was warp_control_cli enabled?"
            exit 1
          fi
          mount_dir="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$DMG_PATH" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null || true' EXIT
          warpctrl_path="$mount_dir/Warpium.app/Contents/Resources/bin/$WARPCTRL_COMMAND_NAME"
          if [[ ! -x "$warpctrl_path" ]]; then
            echo "::error::warpctrl wrapper $WARPCTRL_COMMAND_NAME is missing from the .dmg"
            exit 1
          fi
          echo "warpctrl wrapper in .dmg: Warpium.app/Contents/Resources/bin/$WARPCTRL_COMMAND_NAME"

      - name: Report disk usage
        if: always()
        run: df -h "$GITHUB_WORKSPACE"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 30
          # The .dmg is already compressed (UDZO).
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [preflight, macos-arm64]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg --clobber
          else
            gh release create "$TAG" dist/*.dmg \
              --verify-tag \
              --title "Warpium $TAG" \
              --generate-notes
          fi
