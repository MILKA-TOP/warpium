[project]
name = "warpium-mac-mcp"
version = "0.1.0"
description = "Host-side MCP server that lets a containerized agent build, launch, observe and drive Warpium on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.20,<2",
    "uvicorn>=0.30",
    # macOS-only: window list, screenshots-by-window-id, synthetic input,
    # frontmost-app checks. Skipped on Linux so the unit tests run anywhere.
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]

[project.scripts]
warpium-mac-mcp = "warpium_mac_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warpium_mac_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S603/S607: every subprocess call uses an argument list with a fixed program
# name; that is the intended pattern here.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]
